name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libx11-xcb-dev \
            libxcb-randr0-dev libxcb-keysyms1-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; fi
          cmake -B build $GEN -DCMAKE_BUILD_TYPE=Release -DRTGD_WITH_FMOD=OFF

      - name: Build
        run: cmake --build build --config Release -j4

      - name: Install
        run: cmake --install build --config Release --component Runtime --prefix pkg

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar czf RTGD-${{ matrix.name }}.tar.gz -C pkg .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path pkg/* -DestinationPath RTGD-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RTGD-${{ matrix.name }}
          path: RTGD-${{ matrix.name }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" RTGD-* --repo "$GITHUB_REPOSITORY" --generate-notes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
